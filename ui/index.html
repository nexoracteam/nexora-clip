<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexora Clip</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="assets/logo.png" alt="" />Nexora Clip</div>
    <button class="new-btn" data-nav="create"><span class="ico" data-icon="plus"></span>New generation<span class="kbd">N</span></button>
    <nav>
      <button class="nav-item" data-nav="library"><span class="ico" data-icon="library"></span>Library</button>
      <button class="nav-item" data-nav="publish"><span class="ico" data-icon="send"></span>Publishing</button>
      <button class="nav-item" data-nav="settings"><span class="ico" data-icon="settings"></span>Settings</button>
    </nav>
    <div class="sidebar-foot">
      <div class="status-card" id="sidebar-foot"></div>
      <button class="theme-btn" id="theme-toggle" title="Toggle theme"></button>
    </div>
  </aside>
  <main id="view"></main>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
