[package]
name = "nexora-clip"
version = "1.6.1"
description = "Nexora Clip - AI video clipping, native Rust"
edition = "2021"
license = "AGPL-3.0"

[[bin]]
name = "nexora-clip"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Power"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ttf-parser = "0.25"
tract-onnx = "0.21"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
